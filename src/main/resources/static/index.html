<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFind — Lost and Found Tracker</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success-bg: #ecfdf5;
      --success-text: #047857;
      --warning-bg: #fffbeb;
      --warning-text: #b45309;
      --danger-bg: #fef2f2;
      --danger-text: #b91c1c;
      --radius: 8px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 0;
    }

    /* Minimal Top Navigation */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand span {
      background: #eff6ff;
      color: var(--primary);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .user-select-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .user-select-box select {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      background: #fff;
    }

    /* Sub Navigation Tabs */
    .nav-tabs {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      gap: 1.5rem;
    }
    .nav-tab {
      background: none;
      border: none;
      padding: 0.75rem 0;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .nav-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }

    /* Main Container */
    main {
      max-width: 1100px;
      margin: 1.5rem auto;
      padding: 0 1.25rem 3rem 1.25rem;
    }

    /* Tab Content panels */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Dashboard Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .stat-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .stat-value {
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1;
    }

    /* Filter & Search Bar */
    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    input[type="text"], input[type="date"], select, textarea {
      font-family: inherit;
      padding: 6px 10px;
      font-size: 0.875rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #ffffff;
      outline: none;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 6px 12px;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: #fff;
      border-color: var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { background: #f1f5f9; }
    .btn-sm {
      padding: 3px 8px;
      font-size: 0.75rem;
    }

    /* Item Card Listing */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .item-main h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .item-main p {
      font-size: 0.875rem;
      color: #475569;
      margin-bottom: 0.5rem;
    }
    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .item-meta span { display: inline-flex; align-items: center; gap: 0.25rem; }

    /* Badges */
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-category { background: #f1f5f9; color: #334155; }
    .badge-AVAILABLE, .badge-OPEN { background: var(--success-bg); color: var(--success-text); }
    .badge-CLAIMED { background: var(--warning-bg); color: var(--warning-text); }
    .badge-RETURNED, .badge-RESOLVED { background: #eff6ff; color: var(--primary); }

    /* Match Card Special */
    .match-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .match-score {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--primary);
    }
    .match-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-bottom: 0.75rem;
    }
    .match-col {
      background: #f8fafc;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #edf2f7;
    }
    .match-col h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .match-reason {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Modal Form Styles */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      max-width: 500px;
      width: 90%;
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }
    .modal h2 { font-size: 1.15rem; margin-bottom: 1rem; font-weight: 600; }
    .form-group { margin-bottom: 0.85rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 500; margin-bottom: 0.25rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #0f172a;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 200;
      max-width: 380px;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #b91c1c; }
    .toast.success { background: #047857; }
  </style>
</head>
<body>

  <!-- Top Minimal Header -->
  <header>
    <div class="header-inner">
      <div class="brand">
        CampusFind <span>Live System</span>
      </div>
      <div class="user-select-box">
        <label for="currentUserSelect">Acting as:</label>
        <select id="currentUserSelect" onchange="onUserChanged()">
          <!-- Populated dynamically -->
        </select>
      </div>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="nav-tab" onclick="switchTab('lost')">Lost Reports</button>
      <button class="nav-tab" onclick="switchTab('found')">Found Items</button>
      <button class="nav-tab" onclick="switchTab('matches')">Matches</button>
    </div>
  </header>

  <main>
    <!-- TAB 1: DASHBOARD -->
    <section id="tab-dashboard" class="tab-content active">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-title">Pending Items (Available)</div>
          <div class="stat-value" id="stat-pending">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Claimed Items</div>
          <div class="stat-value" id="stat-claimed">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Returned Items</div>
          <div class="stat-value" id="stat-returned">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Open Lost Reports</div>
          <div class="stat-value" id="stat-open-lost">0</div>
        </div>
      </div>

      <div class="toolbar" style="margin-top: 1rem;">
        <span style="font-size: 0.9rem; color: var(--text-muted);">
          Total Users: <strong id="stat-users">0</strong> (Students: <span id="stat-students">0</span>, Staff: <span id="stat-staff">0</span>)
        </span>
        <button class="btn btn-secondary btn-sm" onclick="loadDashboard()">↻ Refresh Stats</button>
      </div>
    </section>

    <!-- TAB 2: LOST REPORTS -->
    <section id="tab-lost" class="tab-content">
      <div class="toolbar">
        <div class="filter-group">
          <input type="text" id="lost-search-kw" placeholder="Search keywords..." oninput="loadLostReports()">
          <select id="lost-search-cat" onchange="loadLostReports()">
            <option value="">All Categories</option>
          </select>
          <select id="lost-search-status" onchange="loadLostReports()">
            <option value="">All Statuses</option>
            <option value="OPEN">Open</option>
            <option value="RESOLVED">Resolved</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="openModal('modal-lost')">+ Report Lost Item</button>
      </div>
      <div id="lost-list" class="card-list"></div>
    </section>

    <!-- TAB 3: FOUND ITEMS -->
    <section id="tab-found" class="tab-content">
      <div class="toolbar">
        <div class="filter-group">
          <input type="text" id="found-search-kw" placeholder="Search location/title..." oninput="loadFoundItems()">
          <select id="found-search-cat" onchange="loadFoundItems()">
            <option value="">All Categories</option>
          </select>
          <select id="found-search-status" onchange="loadFoundItems()">
            <option value="">All Statuses</option>
            <option value="AVAILABLE">Available</option>
            <option value="CLAIMED">Claimed</option>
            <option value="RETURNED">Returned</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="openModal('modal-found')">+ Log Found Item (Staff)</button>
      </div>
      <div id="found-list" class="card-list"></div>
    </section>

    <!-- TAB 4: MATCHES -->
    <section id="tab-matches" class="tab-content">
      <div class="toolbar">
        <span style="font-size: 0.9rem; color: var(--text-muted);">
          Matches computed dynamically between open lost reports and active found items.
        </span>
        <button class="btn btn-secondary btn-sm" onclick="loadMatches()">↻ Re-scan Matches</button>
      </div>
      <div id="matches-list"></div>
    </section>
  </main>

  <!-- MODAL: REPORT LOST ITEM -->
  <div id="modal-lost" class="modal-backdrop">
    <div class="modal">
      <h2>Report Lost Item</h2>
      <form id="form-lost" onsubmit="submitLostReport(event)">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="lost-title" required placeholder="e.g. Lost Casio fx-991EX">
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select id="lost-category" required></select>
        </div>
        <div class="form-group">
          <label>Location *</label>
          <input type="text" id="lost-location" required placeholder="e.g. Science Block Room 302">
        </div>
        <div class="form-group">
          <label>Lost Date *</label>
          <input type="date" id="lost-date" required>
        </div>
        <div class="form-group">
          <label>Description *</label>
          <textarea id="lost-desc" rows="3" required placeholder="Details, identifying marks..."></textarea>
        </div>
        <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('modal-lost')">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Report</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: LOG FOUND ITEM -->
  <div id="modal-found" class="modal-backdrop">
    <div class="modal">
      <h2>Log Found Item (Staff)</h2>
      <form id="form-found" onsubmit="submitFoundItem(event)">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="found-title" required placeholder="e.g. Found Casio Scientific Calculator">
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select id="found-category" required></select>
        </div>
        <div class="form-group">
          <label>Location Found *</label>
          <input type="text" id="found-location" required placeholder="e.g. Library Study Desk">
        </div>
        <div class="form-group">
          <label>Found Date *</label>
          <input type="date" id="found-date" required>
        </div>
        <div class="form-group">
          <label>Description *</label>
          <textarea id="found-desc" rows="3" required placeholder="Item description, stickers, color..."></textarea>
        </div>
        <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('modal-found')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Found Item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script>
    let users = [];
    let categories = [];
    let currentUserId = 1;

    // Initialize application data
    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('lost-date').valueAsDate = new Date();
      document.getElementById('found-date').valueAsDate = new Date();
      await loadUsers();
      await loadCategories();
      await loadDashboard();
    });

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = 'toast show ' + (isError ? 'error' : 'success');
      setTimeout(() => { toast.className = 'toast'; }, 3500);
    }

    function switchTab(tabName) {
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');

      if (tabName === 'dashboard') loadDashboard();
      if (tabName === 'lost') loadLostReports();
      if (tabName === 'found') loadFoundItems();
      if (tabName === 'matches') loadMatches();
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/auth/users');
        users = await res.json();
        const select = document.getElementById('currentUserSelect');
        select.innerHTML = users.map(u => 
          `<option value="${u.id}">${u.name} (${u.role})</option>`
        ).join('');
        if (users.length > 0) currentUserId = users[0].id;
      } catch (err) {
        console.error('Failed to load users:', err);
      }
    }

    function onUserChanged() {
      currentUserId = Number(document.getElementById('currentUserSelect').value);
      showToast('Switched user to ' + document.getElementById('currentUserSelect').selectedOptions[0].text);
    }

    async function loadCategories() {
      try {
        const res = await fetch('/api/categories');
        categories = await res.json();
        
        const catOptions = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        document.getElementById('lost-category').innerHTML = catOptions;
        document.getElementById('found-category').innerHTML = catOptions;

        const filterOptions = '<option value="">All Categories</option>' + catOptions;
        document.getElementById('lost-search-cat').innerHTML = filterOptions;
        document.getElementById('found-search-cat').innerHTML = filterOptions;
      } catch (err) {
        console.error('Failed to load categories:', err);
      }
    }

    async function loadDashboard() {
      try {
        const res = await fetch('/api/admin/dashboard');
        const d = await res.json();
        document.getElementById('stat-pending').innerText = d.pendingFoundItems;
        document.getElementById('stat-claimed').innerText = d.claimedFoundItems;
        document.getElementById('stat-returned').innerText = d.returnedFoundItems;
        document.getElementById('stat-open-lost').innerText = d.openLostReports;
        document.getElementById('stat-users').innerText = d.totalUsers;
        document.getElementById('stat-students').innerText = d.studentCount;
        document.getElementById('stat-staff').innerText = d.staffCount;
      } catch (err) {
        console.error('Dashboard error:', err);
      }
    }

    async function loadLostReports() {
      const kw = document.getElementById('lost-search-kw').value;
      const cat = document.getElementById('lost-search-cat').value;
      const status = document.getElementById('lost-search-status').value;

      const params = new URLSearchParams();
      if (kw) params.append('keyword', kw);
      if (cat) params.append('categoryId', cat);
      if (status) params.append('status', status);

      try {
        const res = await fetch('/api/lost-reports?' + params.toString());
        const data = await res.json();
        const container = document.getElementById('lost-list');
        if (data.length === 0) {
          container.innerHTML = '<div style="color: var(--text-muted); font-size: 0.9rem; padding: 1rem 0;">No lost reports found.</div>';
          return;
        }

        container.innerHTML = data.map(item => `
          <div class="item-card">
            <div class="item-main">
              <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
                <h3>${escapeHtml(item.title)}</h3>
                <span class="badge badge-${item.status}">${item.status}</span>
                <span class="badge badge-category">${escapeHtml(item.category?.name || '')}</span>
              </div>
              <p>${escapeHtml(item.description)}</p>
              <div class="item-meta">
                <span>📍 ${escapeHtml(item.location)}</span>
                <span>📅 ${item.lostDate}</span>
                <span>👤 Reported by: ${escapeHtml(item.user?.name || '')}</span>
              </div>
            </div>
            ${item.status === 'OPEN' ? `
              <button class="btn btn-secondary btn-sm" onclick="resolveLostReport(${item.id})">Mark Resolved</button>
            ` : ''}
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function resolveLostReport(id) {
      try {
        const res = await fetch(`/api/lost-reports/${id}/resolve`, { method: 'PUT' });
        if (res.ok) {
          showToast('Report marked as Resolved');
          loadLostReports();
          loadDashboard();
        }
      } catch (err) {
        showToast('Failed to resolve report', true);
      }
    }

    async function loadFoundItems() {
      const kw = document.getElementById('found-search-kw').value;
      const cat = document.getElementById('found-search-cat').value;
      const status = document.getElementById('found-search-status').value;

      const params = new URLSearchParams();
      if (kw) params.append('keyword', kw);
      if (cat) params.append('categoryId', cat);
      if (status) params.append('status', status);

      try {
        const res = await fetch('/api/found-items?' + params.toString());
        const data = await res.json();
        const container = document.getElementById('found-list');
        if (data.length === 0) {
          container.innerHTML = '<div style="color: var(--text-muted); font-size: 0.9rem; padding: 1rem 0;">No found items.</div>';
          return;
        }

        container.innerHTML = data.map(item => `
          <div class="item-card">
            <div class="item-main">
              <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
                <h3>${escapeHtml(item.title)}</h3>
                <span class="badge badge-${item.status}">${item.status}</span>
                <span class="badge badge-category">${escapeHtml(item.category?.name || '')}</span>
              </div>
              <p>${escapeHtml(item.description)}</p>
              <div class="item-meta">
                <span>📍 ${escapeHtml(item.location)}</span>
                <span>📅 ${item.foundDate}</span>
                <span>👤 Logged by: ${escapeHtml(item.finder?.name || '')}</span>
                ${item.claimedBy ? `<span>🤝 Claimed by: ${escapeHtml(item.claimedBy.name)}</span>` : ''}
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.4rem; align-items: flex-end;">
              ${item.status === 'AVAILABLE' ? `
                <button class="btn btn-secondary btn-sm" onclick="updateFoundStatus(${item.id}, 'CLAIMED')">Mark Claimed</button>
              ` : ''}
              ${item.status === 'CLAIMED' ? `
                <button class="btn btn-primary btn-sm" onclick="updateFoundStatus(${item.id}, 'RETURNED')">Mark Returned</button>
              ` : ''}
              ${item.status === 'AVAILABLE' ? `
                <button class="btn btn-secondary btn-sm" style="color: #94a3b8;" title="Will test Rule 1 violation" onclick="updateFoundStatus(${item.id}, 'RETURNED')">Test Return Rule</button>
              ` : ''}
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function updateFoundStatus(id, newStatus) {
      try {
        const body = {
          status: newStatus,
          currentUserId: currentUserId,
          claimedByUserId: newStatus === 'CLAIMED' ? currentUserId : null
        };
        const res = await fetch(`/api/found-items/${id}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) {
          showToast(data.message || 'Error updating status', true);
        } else {
          showToast(`Item status changed to ${newStatus}`);
          loadFoundItems();
          loadDashboard();
        }
      } catch (err) {
        showToast('Network error', true);
      }
    }

    async function loadMatches() {
      try {
        const res = await fetch('/api/matches');
        const matches = await res.json();
        const container = document.getElementById('matches-list');
        if (matches.length === 0) {
          container.innerHTML = '<div style="color: var(--text-muted); font-size: 0.9rem; padding: 1rem 0;">No matching lost and found items at this time.</div>';
          return;
        }

        container.innerHTML = matches.map(m => `
          <div class="match-card">
            <div class="match-header">
              <span class="match-score">★ ${m.matchScore}% Match Confidence</span>
              <span class="badge badge-category">${escapeHtml(m.lostReport.category?.name || '')}</span>
            </div>
            <div class="match-cols">
              <div class="match-col">
                <h4>Lost Item</h4>
                <strong>${escapeHtml(m.lostReport.title)}</strong>
                <p style="font-size: 0.8rem; color: #475569; margin: 4px 0;">${escapeHtml(m.lostReport.description)}</p>
                <div style="font-size: 0.75rem; color: var(--text-muted);">📍 ${escapeHtml(m.lostReport.location)}</div>
              </div>
              <div class="match-col">
                <h4>Found Item</h4>
                <strong>${escapeHtml(m.foundItem.title)}</strong>
                <p style="font-size: 0.8rem; color: #475569; margin: 4px 0;">${escapeHtml(m.foundItem.description)}</p>
                <div style="font-size: 0.75rem; color: var(--text-muted);">📍 ${escapeHtml(m.foundItem.location)}</div>
              </div>
            </div>
            <div class="match-reason">Reason: ${escapeHtml(m.matchReason)}</div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function submitLostReport(e) {
      e.preventDefault();
      const payload = {
        title: document.getElementById('lost-title').value,
        categoryId: Number(document.getElementById('lost-category').value),
        location: document.getElementById('lost-location').value,
        lostDate: document.getElementById('lost-date').value,
        description: document.getElementById('lost-desc').value,
        userId: currentUserId
      };
      try {
        const res = await fetch('/api/lost-reports', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          showToast('Lost report filed successfully!');
          closeModal('modal-lost');
          document.getElementById('form-lost').reset();
          document.getElementById('lost-date').valueAsDate = new Date();
          loadLostReports();
          loadDashboard();
        } else {
          const err = await res.json();
          showToast(err.message || 'Validation failed', true);
        }
      } catch (err) {
        showToast('Network error', true);
      }
    }

    async function submitFoundItem(e) {
      e.preventDefault();
      const payload = {
        title: document.getElementById('found-title').value,
        categoryId: Number(document.getElementById('found-category').value),
        location: document.getElementById('found-location').value,
        foundDate: document.getElementById('found-date').value,
        description: document.getElementById('found-desc').value,
        finderId: currentUserId
      };
      try {
        const res = await fetch('/api/found-items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          showToast('Found item logged successfully!');
          closeModal('modal-found');
          document.getElementById('form-found').reset();
          document.getElementById('found-date').valueAsDate = new Date();
          loadFoundItems();
          loadDashboard();
        } else {
          const err = await res.json();
          showToast(err.message || 'Validation failed', true);
        }
      } catch (err) {
        showToast('Network error', true);
      }
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function escapeHtml(s) {
      if (!s) return '';
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
